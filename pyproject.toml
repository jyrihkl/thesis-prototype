[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "team-builder-prototype"
version = "0.1.0"
description = "Prototype decision-support pipeline for project team formation."
requires-python = ">=3.10"
dependencies = []

[project.scripts]
team-builder = "team_builder.cli:main"
team-builder-batch = "team_builder.batch_cli:main"

[tool.setuptools.packages.find]
where = ["src"]
